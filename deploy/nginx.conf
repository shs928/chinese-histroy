server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name history.blessingshs.cc.cd;
    ssl_certificate /etc/nginx/cert.crt;
    ssl_certificate_key /etc/nginx/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/blessing-history/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Original learning modules use inline styles and event handlers. Frames stay same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.is.autonavi.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; frame-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/geo+json image/svg+xml application/xml;
    location ~ /\. { deny all; }
    location ~* \.(?:jpg|jpeg|png|webp|woff2|svg|mp3|ogg)$ { try_files $uri =404; expires 7d; }
    location /downloads/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; expires -1; }
}
